    <meta name="color-scheme" content="dark">
    <!-- Then the specific darkness can rule all of it. -->
    <link rel="stylesheet" href="tasked.css" />
    <title>TASKED</title>
  </head>
  <body onload="openCountsView('NEAR')">
    <script src="tasked.js"></script>
    <div class="book">
      <div class="spine">
        <span class="spinal">TASKED</span>
      </div>
      <div class="page">
        <div class="page-header" id="page-header">
        </div>
        <hr/>
        <div class="page-detail" id="page-detail">
        </div>
        <hr/>
        <div id="task-entry-details">
        </div>
        <hr/>
        <div class="page-footer" id="page-footer">
        </div>
      </div>
    </div>
  </body>
</html>
