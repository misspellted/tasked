server {
    listen 80; # This is the "right is theirs" port in the docker-compose.yml file.
    server_name localhost;

    # Serve the static frontend files
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* through to the FastAPI backend
    # The browser calls /api/tasks, nginx forwards to http://api:8000/api/tasks
    # One origin, zero CORS drama
    location /api/ {
        proxy_pass http://api:8000/api/; # Similarly, this is the API's "right is theirs" port.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else is a frontend route - serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
